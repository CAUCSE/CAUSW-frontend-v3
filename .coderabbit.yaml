# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "ko-KR"
tone_instructions: "일반적인 피드백, 요약, 변경 사항 설명, 칭찬은 지양하고 구체적이고 객관적인 지적만 남겨주세요. 수정이 필요한 경우 올바른 패턴을 코드 예시와 함께 제시해주세요."
early_access: false

reviews:
  profile: chill
  high_level_summary: false
  poem: false
  review_status: true

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: false
    ignore_usernames:
      - "dependabot[bot]"

  path_filters:
    - "!.github/**"
    - "!.husky/**"
    - "!.storybook/**"
    - "!.vscode/**"

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "STYLEGUIDE.md"

chat:
  auto_reply: true
